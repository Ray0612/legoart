name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么场景 / 痛点？这个功能为什么有价值？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望它怎么工作？（可附草图、伪代码或参考实现）
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其它做法或现成工具
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可多选）
      options:
        - label: 核心算法
        - label: 桌面端 UI
        - label: 导出/数据
        - label: 文档
