[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legoart"
version = "0.1.0"
description = "乐高画作智能转换器 - convert pictures into LEGO mosaic building plans (core algorithm library)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "legoart contributors" }]
keywords = ["lego", "mosaic", "pixel-art", "image-processing", "ciede2000", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.0",
    "Pillow>=11",
    "opencv-python>=4.10",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/OWNER/legoart"
Repository = "https://github.com/OWNER/legoart"
Issues = "https://github.com/OWNER/legoart/issues"

[project.optional-dependencies]
desktop = ["PyQt6>=6.7"]
# torch is intentionally NOT declared here (heavy). Enable saliency/detection by:
#   pip install -e ".[ml]"   -> installs torch + torchvision (choose CPU wheel on Windows)
ml = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
